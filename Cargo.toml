[package]
name = "easyconfig"
version = "0.1.0"
edition = "2024"
authors = ["Grayson Rieger graysonr12@icloud.com"]
license = "MIT"
description = "Write to a config in the AppData or custom dir"
repository = "https://github.com/graysonrie/easyconfig"

[dependencies]
serde = { "version" = "1.0.228", "features" = ["derive"] }
serde_json = { "version" = "1.0.145", "features" = ["preserve_order"] }
dirs = "6.0.0"
anyhow = "1.0.104"

[dev-dependencies]
tempfile = "3.27.0"
